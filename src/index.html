<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运营分析工作台 · Web 版</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">

  </aside>

<script src="assets/js/data.js"></script>
