name: 每日数据采集

# 北京时间每天 01:00（UTC 17:00）从产品后台采集数据并发布到数据源目录。
# 采集成功后站点重新发布，浏览器端打开页面即自动同步 —— 无需手动上传。
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '采集日期 YYYY-MM-DD（留空 = 昨天）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: collect-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node（用于重建 manifest.json）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 采集数据
        env:
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          pwsh -NoProfile -File scripts/collect-daily.ps1 -Date "${{ inputs.date }}"

      - name: 结果摘要
        if: always()
        run: |
          echo "### 数据源清单" >> $GITHUB_STEP_SUMMARY
          node -e "const m=require('./src/data/manifest.json');console.log('counts='+JSON.stringify(m.counts)+' latest='+JSON.stringify(m.latest))" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "（清单尚未生成）" >> $GITHUB_STEP_SUMMARY