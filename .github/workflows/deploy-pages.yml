name: Deploy Web Workbench

# 把本文件夹作为仓库根目录推送后，本工作流会把 src/ 目录发布到 GitHub Pages。
# 首次使用：仓库 Settings -> Pages -> Source 选择 "GitHub Actions"。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # 仓库还没开 Pages 时自动开启（省去手动到 Settings -> Pages 点一次）
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4